[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapcore"
version = "0.2.0"
description = "SynapCore: Native C++17 / Objective-C++ Metal & MLX Low-RAM Mixture-of-Experts (MoE) Inference Engine via merkle_tree.idx Binary mmap Storage & 64 KB Flat XOR Merkle Trees"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Suru Martian (Martian Academy)" }
]
keywords = [
  "moe",
  "mixture-of-experts",
  "merkle-tree",
  "apple-metal",
  "mlx",
  "low-ram-inference",
  "olmoe",
  "mmap"
]
dependencies = [
  "numpy>=1.24.0",
  "torch>=2.1.0",
  "tokenizers>=0.15.0",
  "mlx>=0.30.0",
  "mlx-lm>=0.30.0"
]

[project.scripts]
synapcore-store = "merkle_store:main"
synapcore-build-db = "native.build_native_db:compile_native_binaries"
synapcore-chat = "native.native_chat:main"

[tool.setuptools]
py-modules = ["merkle_store"]
packages = ["native"]
